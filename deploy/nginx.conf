map $request_uri $skladex_access_log {
    default 1;
    ~^/setup(\?|$) 0;
}
server {
    listen 80 default_server;
    server_name skladex.vve.local 192.168.110.203;
    server_tokens off;
    access_log /var/log/nginx/skladex.access.log combined if=$skladex_access_log;
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name skladex.vve.local 192.168.110.203;
    root /srv/skladex/app/public;
    index index.php;
    ssl_certificate /etc/skladex/tls/fullchain.pem;
    ssl_certificate_key /etc/skladex/tls/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:skladex_ssl:10m;
    server_tokens off;
    client_max_body_size 12m;
    access_log /var/log/nginx/skladex.access.log combined if=$skladex_access_log;
    add_header X-Content-Type-Options nosniff always;
    location = /setup { access_log off; try_files $uri /index.php?$query_string; }
    location = /cabinet.php { try_files $uri /index.php?$query_string; }
    location = /equipment_card.php { try_files $uri /index.php?$query_string; }
    location = /qr_scan.php { try_files $uri /index.php?$query_string; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location /assets/ { expires 7d; access_log off; try_files $uri =404; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/skladex.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
